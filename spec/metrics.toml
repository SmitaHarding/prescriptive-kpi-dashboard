# Metrics register (R-DET-01, R-DET-03). Owned by the PMO lead; changes approved, versioned, re-tested.
# All targets and bands are assumptions from the author's operating experience (N7). Agreed in F2a.
#
# Weeks: every metric is keyed to week W: the invoice week (the service week), except dispute
# resolution, which is keyed to the week the ticket is opened. The Tuesday run in week W+1 issues
# week W's invoices; the Monday review in week W+2 is the first to show invoice week W.
# Days: a clock that measures how long a partner, an invoice or an open issue waits counts calendar
# days. Only the dispute-resolution time limit, which measures the team's response, counts business
# days (Monday to Friday; the simulated year has no public holidays). A clock counts whole days after the day it starts.
# Bands: target and red_beyond per metric; how they colour a figure: R-DET-01.

[display]
decimals = 1            # colour is set on the figure as shown (R-DET-01)
rounding = "half_up"

[[metric]]
id = "payment_accuracy"
shown = "coloured"
direction = "higher_is_better"
unit = "percent"
definition = "Share of week W's invoices with no confirmed payment error (N12). Counted by invoice: one wrong line makes the invoice wrong. Each error is attributed to its invoice week."
target = 97.0
red_beyond = 90.0       # red below 90.0
final_when = "the dispute window for week W has closed"

[[metric]]
id = "dispute_resolution_on_time"
shown = "coloured"
direction = "higher_is_better"
unit = "percent"
definition = "Share of dispute tickets opened in week W that are resolved within the time limit. Resolved: closed with an outcome (upheld or rejected) and the partner told. The clock starts when the ticket is opened."
time_limit_business_days = 5   # the author's operating rule; not yet in the SOP
target = 95.0
red_beyond = 85.0       # red below 85.0
final_when = "every dispute ticket opened in week W has had its time limit"

[[metric]]
id = "dispute_rate"
shown = "coloured"
direction = "lower_is_better"
unit = "percent"
definition = "Share of week W's invoices disputed within the dispute window. Counted by invoice: an invoice disputed twice counts once. A dispute after the window is logged and worked, but not counted here."
target = 3.0
red_beyond = 5.0        # red above 5.0
final_when = "the dispute window for week W has closed"

[[metric]]
id = "stuck_invoices"
shown = "monitored"     # no target and no colour
unit = "percent"
definition = "Share of week W's invoices stuck at any point in the process chain for more than the stuck limit, for example waiting for approval. Also shown as a count."
stuck_limit_calendar_days = 2
final_when = "all of week W's invoices are paid"

[windows]
dispute_window_days = 14   # calendar days; mirrors N12 for the code (N6)

[context]
invoice_volume = "shown as context, never coloured"
dispute_tickets_opened = "count of dispute tickets opened in week W; shown as context, never coloured"
