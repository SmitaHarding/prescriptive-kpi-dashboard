# ── v1 defects (the structural ones; full register in the v1 review, published in Wrap-up) ─────
[[v1_defect]]
id = "V1-01"
title = "Severity binary and level-only; recoveries flagged as critical"
[[v1_defect]]
id = "V1-02"
title = "No constraint on recommendations: no capacity, working-time or authority limits"
[[v1_defect]]
id = "V1-03"
title = "Exactly three interventions, mandatory — padding on thin weeks"
[[v1_defect]]
id = "V1-04"
title = "Fabricated impact figures presented as forecasts"
[[v1_defect]]
id = "V1-05"
title = "No abstention path: a confident cause was required every week"
[[v1_defect]]
id = "V1-06"
title = "Nothing persisted: no audit trail, acceptance unmeasurable"
[[v1_defect]]
id = "V1-07"
title = "Notes contained the answer and restated KPI values"
[[v1_defect]]
id = "V1-08"
title = "A derived metric counted as independent evidence"
[[v1_defect]]
id = "V1-09"
title = "No handling of month-end and quarterly cycles"
[[v1_defect]]
id = "V1-10"
title = "Volume base contradicted between code and docs"
[[v1_defect]]
id = "V1-11"
title = "Model output rendered as raw HTML — an injection path"
[[v1_defect]]
id = "V1-12"
title = "Docs described a system that did not exist"

# ── Safeguards: protect the model-against-rules comparison and the holdout ─
[[safeguard]]
id = "freeze-first"
title = "Freeze first: rules version, case mix, margin, rubric and expected answers fixed and fingerprinted at the end of the Harness phase, before the first scored run; after that only the author changes them, by a new decision; results reported per case type"
[[safeguard]]
id = "holdout-sealed"
title = "Holdout sealed: written by a separate agent, kept outside the project, run once after Build 4 for both the model and the rules version"
[[safeguard]]
id = "blind-scoring"
title = "Blind scoring: wherever the author scores, outputs are shuffled and unlabelled"
[[safeguard]]
id = "never-fit-the-answer"
title = "Never fit the answer: before the freeze, an ambiguous scenario is rewritten (held-out scenarios by their separate agent); after the freeze, a flawed scenario is excluded and reported; an expected answer is never changed to match an output"
[[safeguard]]
id = "cost-beside-accuracy"
title = "Cost beside accuracy: model cost per week is shown next to every model-against-rules result"

# ── Terms and glossary ([One home per fact]): one preferred term per concept ──────────────
[[term]]
use = "the model"
replaces = ["the AI", "the agent"]
meaning = "the AI inside the product"
[[term]]
use = "the builder"
replaces = []
meaning = "the agent that builds the code under a charter ([Phases and the builder])"
[[term]]
use = "suspected cause"
replaces = ["proposed cause"]
meaning = "a cause before people confirm it"
[[term]]
use = "the author"
replaces = []
meaning = "the project's owner"
[[term]]
use = "PMO lead"
replaces = []
meaning = "a role in the simulated operation, played by the author in the prototype"
[[term]]
use = "possible issue"
replaces = []
meaning = "a cluster proposed by the rules or model version; it becomes an issue when the PMO lead accepts it in review"
[[term]]
use = "review screen"
replaces = []
meaning = "where drafts and ticket claims are shown before anything reaches the ops or exec view"
[[term]]
use = "committed hours"
replaces = []
meaning = "the whole workload in [Capacity check], including every reported intervention; [Enough capacity?] starts from it ([The Monday decision])"
[[term]]
use = "weekly hours limit"
replaces = ["working-time limit"]
meaning = "max_hours_per_person in the capacity file: the most anyone works in a week ([Weekly hours limit])"
[[term]]
use = "overtime proposal"
replaces = []
meaning = "a capacity proposal, not an intervention"
[[term]]
use = "expected answer"
replaces = []
meaning = "the right answer written into a scenario's definition ([Scenarios and the holdout])"
[[term]]
use = "dispute ticket"
replaces = []
meaning = "the record of one dispute; 'case' alone means a test case"
[[term]]
use = "intervention"
replaces = ["containment action"]
meaning = "an action that moves an issue towards its next stage; the model drafts only those that contain it ([Issue lifecycle])"
[[term]]
use = "case type"
replaces = ["scenario type", "scenario kind"]
meaning = "a kind of test scenario, such as thin evidence or prompt injection"
[[term]]
use = "weekly record"
replaces = ["decision record", "audit record"]
meaning = "the append-only file for one week: every draft, edit, decision, partner contact and stage move ([Records and replay], [Append-only record]); both views and the replay are built from it"
[[term]]
use = "status claim"
replaces = []
meaning = "a document saying something is built ([Documents match what exists]); 'claim' alone means a ticket claim ([Ticket claims are claims])"
[[term]]
use = "the PMO lead's review"
replaces = ["review gate"]
meaning = "the step where the PMO lead accepts, edits or rejects drafts on the review screen"
[[term]]
use = "dispute"
replaces = []
meaning = "a partner's objection to an invoice; each is recorded as one dispute ticket"
[[term]]
use = "held-out quarter"
replaces = []
meaning = "weeks 40-52, sealed and run once ([The year], [Scenarios and the holdout]); 'holdout' is its short form"
[[term]]
use = "scenario"
replaces = []
meaning = "a planted pattern over several weeks, with its expected answer ([Scenarios and the holdout]); a test case checks one requirement against a scenario or one of its weeks"
