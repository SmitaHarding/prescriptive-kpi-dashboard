# ── v1 defects (the structural ones; full register in the v1 review) ─────
[[v1_defect]]
id = "V1-01"
title = "Severity binary and level-only; recoveries flagged as critical"
[[v1_defect]]
id = "V1-02"
title = "No constraint on recommendations: no capacity, working-time or authority limits"
[[v1_defect]]
id = "V1-03"
title = "Exactly three interventions, mandatory — padding on thin weeks"
[[v1_defect]]
id = "V1-04"
title = "Fabricated impact figures presented as forecasts"
[[v1_defect]]
id = "V1-05"
title = "No abstention path: a confident cause was required every week"
[[v1_defect]]
id = "V1-06"
title = "Nothing persisted: no audit trail, acceptance unmeasurable"
[[v1_defect]]
id = "V1-07"
title = "Notes contained the answer and restated KPI values"
[[v1_defect]]
id = "V1-08"
title = "A derived metric counted as independent evidence"
[[v1_defect]]
id = "V1-09"
title = "No handling of month-end and quarterly cycles"
[[v1_defect]]
id = "V1-10"
title = "Volume base contradicted between code and docs"
[[v1_defect]]
id = "V1-11"
title = "Model output rendered as raw HTML — an injection path"
[[v1_defect]]
id = "V1-12"
title = "Docs described a system that did not exist"

# ── Safeguards ───────────────────────────────────────────────────────────
[[safeguard]]
id = "SG-01"
title = "Rules baseline approved by the PMO lead and frozen before any scoring"
[[safeguard]]
id = "SG-02"
title = "Both versions also scored on the sealed holdout, once per slice"
[[safeguard]]
id = "SG-03"
title = "Blind, shuffled scoring wherever a person judges"
[[safeguard]]
id = "SG-04"
title = "Case mix fixed before any results; results reported per case type"
[[safeguard]]
id = "SG-05"
title = "Margin set before results, calibrated once from run-to-run variation"
[[safeguard]]
id = "SG-06"
title = "Model cost shown alongside accuracy"
[[safeguard]]
id = "SG-07"
title = "Spot-check about 1 in 5 of the labels everyone agreed on"
[[safeguard]]
id = "SG-08"
title = "Holdout written by a separate agent and sealed from the build"
[[safeguard]]
id = "SG-09"
title = "'The case is flawed' is an allowed outcome; labels never changed to fit"
[[safeguard]]
id = "SG-10"
title = "Judgement labels are acceptable options plus rubric points"
[[safeguard]]
id = "SG-11"
title = "Disagreements answered before seeing the two labels"
