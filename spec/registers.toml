# Registers: the machine-readable half of the chain ([One home per fact]).
# Chain: v1 defect -> risk -> requirement -> eval case -> code -> status claim. evals/check.py checks it up to
# requirement today; the later links are added from the Harness phase.
# Each id is the entry's name as a slug, equal to its heading anchor ([Names, not codes]).
# Decision wording lives only in method/decisions.md; requirement wording only in method/02-requirements.md.
# Earlier numbered codes map to names in method/archive/code-map.md.
# v1 defects keep their numbers: they are cited only here and in the v1 annex.

[status]
stage = "Pass/fail requirements complete; some thresholds and cases follow in the Judgement and data and Harness phases"
next = "the spike; Judgement and data items that do not depend on it are drafted privately meanwhile"
built = []   # no product code yet; Build 1 adds the first entries

