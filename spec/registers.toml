# ── Risks: what the requirements control ───────────────────────────────
# evidence = v1 defects showing the risk is real
[[risk]]
id = "RK-01"
title = "False alarm: a normal month-end or a recovering metric is treated as a problem"
evidence = ["V1-01", "V1-09"]
[[risk]]
id = "RK-02"
title = "Missed or late issue: a real dispute pattern is found later than the team's own rules would find it"
evidence = []
[[risk]]
id = "RK-03"
title = "Wrong cause: a suspected cause is shown as fact, or a partner's guess is taken as the cause"
evidence = ["V1-05"]
[[risk]]
id = "RK-04"
title = "Overconfidence: confidence higher than the evidence supports, or one signal counted twice"
evidence = ["V1-05", "V1-08"]
[[risk]]
id = "RK-05"
title = "Infeasible plan: interventions exceed team hours, the working-time limit or the approver's authority"
evidence = ["V1-02"]
[[risk]]
id = "RK-06"
title = "Padding: generic or duplicate interventions to fill a quota"
evidence = ["V1-03"]
[[risk]]
id = "RK-07"
title = "Invented figures: numbers, dates or impact forecasts the model made up"
evidence = ["V1-04"]
[[risk]]
id = "RK-08"
title = "Unsafe text: instructions in ticket text change the output, or text renders as code"
evidence = ["V1-11"]
[[risk]]
id = "RK-09"
title = "Unreviewed output: a model draft reaches the ops or exec view before the PMO lead has reviewed it"
evidence = []
[[risk]]
id = "RK-10"
title = "No trail: what was proposed, changed and decided can't be rebuilt, so value can't be measured"
evidence = ["V1-06"]
[[risk]]
id = "RK-11"
title = "Stalled issue: an open issue sits in one stage too long without anyone noticing"
evidence = []
[[risk]]
id = "RK-12"
title = "Breaks the SOP: an intervention would stop or delay the weekly payment run or skip the approval chain"
evidence = []
[[risk]]
id = "RK-13"
title = "Leaky test: the data or the scenario text gives away the answer"
evidence = ["V1-07"]
[[risk]]
id = "RK-14"
title = "Overfitting: the build is tuned to the cases it is scored on"
evidence = []
[[risk]]
id = "RK-15"
title = "The model not earning its place: the model is no better than simple rules, or costs too much for what it adds"
evidence = []
[[risk]]
id = "RK-16"
title = "Drift: a new model, prompt, cause list or playbook quietly makes results worse"
evidence = []
[[risk]]
id = "RK-17"
title = "Docs overclaim or contradict: they describe more than is built, or state numbers that disagree"
evidence = ["V1-10", "V1-12"]
[[risk]]
id = "RK-18"
title = "Missed stuck invoice: an invoice stuck in the process chain is missing from the ops list, so nobody remedies it before the partner chases payment"
evidence = []
[[risk]]
id = "RK-19"
title = "Views disagree: the ops and exec views show different figures for the same week, or leave out what a role must act on"
evidence = []
[[risk]]
id = "RK-20"
title = "Privacy leak: a tracked file names the employer, an internal tool or a person other than the author"
evidence = []

