# Thresholds file ([One home per fact]). Tunable limits the requirements cite. Owned by the PMO lead;
# changes approved, versioned, re-tested ([Change gate]).
# Items frozen under Freeze first (the margin) change only as [Model against rules] sets out. Every figure is an assumption ([Assumptions]).

[trends]
trend_window_weeks = 4                 # [Colour shows the level]: average, sparkline and "n/a" window

[confidence]
high_min_evidence_types = 2            # [Confidence is measured]: independent evidence types needed for high

[comparison]
margin = "set in the Harness phase, before the freeze"            # [Model against rules], [Detection against rules] (Freeze first)

[drift]
limits = "set in the Harness phase"                                # [Change gate]

[lifecycle]
stage_limits_calendar_days = "set in the Judgement and data phase"           # [Overdue issues]

[cycles]
min_earlier_cycles = "set in the Judgement and data phase"                   # [Cycle weeks]
