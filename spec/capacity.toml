# Capacity file (R-DET-05, R-RL-01). Owned by the PMO lead; changes approved, versioned, re-tested.
# Every figure is an assumption from operating experience (N7).

team_fte = 5
hours_per_fte = 40
protected_hours_per_fte = 4        # meetings and admin
overtime_hours_per_fte = 8         # approved by the team manager
max_hours_per_person = 48          # red line R-RL-01

[workload]
payment_run_hours = 50             # weekly payment run
hours_per_dispute = 1.5            # investigate and reply (R-DET-05)
hours_per_confirmed_error = 0.5    # back-payment or correction, whoever found it (R-DET-05)
hours_per_stuck_invoice = 0.5
# plus reported interventions, as R-DET-05 sets.

[utilisation]
ceiling = 0.90                     # share of productive hours; the rest is the buffer for absence, which is not modelled
