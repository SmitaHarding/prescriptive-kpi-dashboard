# Known-bad inputs for "Which interventions?" in 02-requirements.md ([Requirements and evals]).
# Each case is a draft the model could produce, or a playbook a careless edit could produce. The
# check must fail every `bad` and pass every `must_pass`. Playbook figures mirror spec/playbook.toml ([One home per fact]).
#
# Evidence code gave the model (week 31): possible issue on fuel lines since week 29; 37 tickets;
# 143 affected invoices; ticket refs T-31-0101 to T-31-0137. Playbook entry: contact_partners.
# Code sets the due week: the week reported plus the entry's weeks_allowed (check.py's known-bad check).

[[case]]
requirement = "no-invented-figures-or-dates"
covers = "every number is in the evidence or the playbook entry"
bad = [
  { text = "Contact the 150 affected partners.",                    why = "150 is not in the evidence" },
  { text = "Contact the two hundred affected partners.",             why = "a number in words is still a number" },
  { text = "143 of 1,500 invoices (9.5%) are affected.",             why = "1,500 and 9.5 are not in the evidence; derived figures fail" },
]
must_pass = [
  "Contact the partners on the 143 affected invoices.",
  "See T-31-0101 and T-31-0112; the pattern starts in week 29.",
]

[[case]]
requirement = "no-invented-figures-or-dates"
covers = "no expected impact"
bad = [
  { text = "Expected to cut fuel disputes by 30%.",  why = "an impact forecast with a number" },
  { field = "expected_impact",                       why = "the draft schema has no impact field" },
]

[[case]]
requirement = "no-invented-figures-or-dates"
covers = "code sets dates; the model sets none"
type = "contact_partners"
week_reported = 31
bad = [
  { text = "Complete by 15 November.",  why = "a date from the model" },
  { due_week = 33,                      why = "not the week reported plus weeks_allowed" },
]

[[case]]
requirement = "no-invented-figures-or-dates"
covers = "effort comes from the playbook entry; an off-playbook draft states none"
bad = [
  { type = "contact_partners", effort_hours = [2, 4],  why = "outside the playbook range" },
  { off_playbook = true,       effort_hours = [3, 3],  why = "the PMO lead sets it in review ([Capacity check])" },
]

# ── Coverage without padding ────────────────────────────────
# Two suspected causes this week: wrong_fuel and unit_price.
[[case]]
requirement = "coverage-without-padding"
covers = "every suspected cause has an intervention or a deferral with a reason"
bad = [
  "unit_price has no intervention and no deferral",
  "unit_price deferred with reason = ''",
]

[[case]]
requirement = "coverage-without-padding"
covers = "no two interventions of the same playbook type for one cause and stage"
bad = "two contact_partners interventions for wrong_fuel at Contained"
must_pass = "investigate and contact_partners for wrong_fuel at Contained (different needs)"

[[case]]
requirement = "coverage-without-padding"
covers = "each intervention names its cause and stage and cites evidence that exists"
bad = [
  "an intervention with no cause",
  "an intervention with no stage",
  "an intervention citing evidence id E-31-09, which code did not give the model",
]

# ── The playbook respects the SOP ───────────────────────────
[[case]]
requirement = "the-playbook-respects-the-sop"
covers = "the playbook fails to load with a type off its list or a forbidden type"
runs_in = "CI, when the playbook loads"
bad = [
  "an entry with type = 'hold_payments', not in the types list",
  "types list and entry both include 'hold_run'",
  "types list and entry both include 'pay_outside_approval'",
]
must_pass = "add_run_check, whose step says 'it never holds the run'"

[[case]]
requirement = "the-playbook-respects-the-sop"
covers = "the model sees and cites only Contained entries that fit the suspected cause"
bad = [
  "a draft citing confirm_cause (stage Cause confirmed)",
  "a draft citing add_run_check for payment_not_received, which that entry does not fit",
  "the prompt includes a later-stage entry",
]

[[case]]
requirement = "the-playbook-respects-the-sop"
covers = "off-playbook drafts are labelled, carry no effort and are shown only after review"
bad = [
  "an off-playbook draft without the off-playbook label",
  "an off-playbook draft in the ops view before review",
]

# ── Failed checks are never repaired ────────────────────────
# A stub model returns scripted drafts, so these run in CI without the model.
[[case]]
requirement = "failed-checks-are-never-repaired"
covers = "a failing draft is rejected, retried once, then replaced by the fixed text"
stub_drafts = ["fails [No invented figures or dates]", "fails [No invented figures or dates]"]
right = "item shows 'requires human review: failed check' and '[No invented figures or dates]'; both drafts in the record"
bad = [
  "the first draft shown",
  "the invented number removed and the draft shown (code repaired it)",
  "a third attempt",
  "fixed text without the check's name",
  "the rejected drafts missing from the record",
]

[[case]]
requirement = "failed-checks-are-never-repaired"
covers = "a passing second draft is shown; the first stays in the record"
stub_drafts = ["fails [Coverage without padding]", "passes"]
must_pass = "second draft on the review screen; first draft in the record as rejected"
